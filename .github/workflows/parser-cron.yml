name: Discover E-Auksion Candidates (No DB Writes)

on:
  schedule:
    # Запуск каждый день в 6:00 утра по UTC (11:00 по Ташкенту)
    - cron: '0 6 * * *'
  workflow_dispatch: # Позволяет запускать вручную кнопкой в GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 22

    - name: Install dependencies
      run: |
        npm install
        npx playwright install chromium

    - name: Discover unverified E-Auksion candidates
      run: node parser.js

    - name: Commit and Push updates
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add data/auction-candidates.json
        git diff-index --quiet HEAD || git commit -m "chore: refresh unverified auction candidates [Cron]"
        git push